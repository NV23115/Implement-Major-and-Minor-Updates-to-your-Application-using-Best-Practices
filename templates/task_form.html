{% extends 'layout.html' %}

{% block content %}
  <h2>{{ 'Edit Task' if task else 'New Task' }}</h2>
  <form method="post" action="{{ url_for('edit_task', task_id=task.id) if task else url_for('create_task') }}">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" name="title" value="{{ task.title if task else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3">{{ task.description if task else '' }}</textarea>
    </div>
    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">Priority</label>
        <select class="form-select" name="priority">
          {% for value in priorities %}
            <option value="{{ value }}" {% if task and task.priority == value %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          {% for value in statuses %}
            <option value="{{ value }}" {% if task and task.status == value %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Due Date</label>
        <input type="date" class="form-control" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task and task.due_date else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Tags (comma separated)</label>
      <input type="text" class="form-control" name="tags" value="{% if task %}{{ task.tags | join(', ') }}{% endif %}">
    </div>
    <button type="submit" class="btn btn-primary">Save Task</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
{% endblock %}
